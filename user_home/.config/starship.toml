# Only show directory, git branch, git status, and the prompt character
format = "$directory$git_branch$git_status$character"

# Abort slow commands (e.g. git on huge repos) after 2s
command_timeout = 2000

[directory]
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "
style = "bold purple"

[git_status]
# Skip submodule checks (major speedup in repos with submodules)
ignore_submodules = true
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
