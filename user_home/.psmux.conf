###########################################################################
# Remap prefix from default (C-b) to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

###########################################################################
# General options

# Use PowerShell as the default shell so the profile loads (starship prompt)
set -g default-shell "powershell.exe"

# scrollback size
set -g history-limit 10000

# Use vim-like keys in copy mode
set -g mode-keys vi

###########################################################################
# General keymap

# reload psmux config
unbind r
bind r \
    source-file ~/.psmux.conf \;\
    display 'Reloaded psmux config.'

# open panes in current directory
bind '"' split-window -c "#{pane_current_path}" powershell.exe
bind % split-window -h -c "#{pane_current_path}" powershell.exe

###########################################################################
# Plugins

# Plugin manager
set -g @plugin 'psmux-plugins/ppm'
# Clipboard integration (replaces tmux-yank)
set -g @plugin 'psmux-plugins/psmux-yank'

# start the plugin manager, must be at bottom of conf file
run '~/.psmux/plugins/ppm/ppm.ps1'
