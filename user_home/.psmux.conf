###########################################################################
# Remap prefix from default (C-b) to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

###########################################################################
# General options

# Use PowerShell as the default shell so the profile loads (starship prompt)
set -g default-shell "pwsh.exe"

###########################################################################
# General keymap

# reload psmux config
unbind r
bind r \
    source-file ~/.psmux.conf \;\
    display 'Reloaded psmux config.'

# open panes in current directory
bind '"' split-window -c "#{pane_current_path}" pwsh.exe
bind % split-window -h -c "#{pane_current_path}" pwsh.exe

###########################################################################
# Plugins

# Plugin manager
set -g @plugin 'psmux-plugins/ppm'
# Sensible defaults
set -g @plugin 'psmux-plugins/psmux-sensible'
# Themes (comment/uncomment to switch; only one at a time)
# Custom 1g brand theme (layout from everforest, 1g brand colors)
# run '~/.psmux-theme-1g.ps1' is added below after ppm
#
#set -g @plugin 'psmux-plugins/psmux-theme-nord'
#set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'
#set -g @plugin 'psmux-plugins/psmux-theme-dracula'
#set -g @plugin 'psmux-plugins/psmux-theme-everforest'
#set -g @plugin 'psmux-plugins/psmux-theme-gruvbox'
#set -g @plugin 'psmux-plugins/psmux-theme-kanagawa'
#set -g @plugin 'psmux-plugins/psmux-theme-onedark'
#set -g @plugin 'psmux-plugins/psmux-theme-rosepine'
#set -g @plugin 'psmux-plugins/psmux-theme-tokyonight'

# start the plugin manager, must be at bottom of conf file
run '~/.psmux/plugins/ppm/ppm.ps1'

# Custom 1g theme (runs after ppm so it takes precedence over any plugin theme)
run '~/.psmux-theme-1g.ps1'
